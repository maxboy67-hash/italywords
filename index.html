<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ITALYWORDS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen game. Sky band at top (region + grid), letter wheel anchored at bottom. Single deliberate look: dusk sky per region. */
:root{
  --ink:#1d2433;
  --tile:#fffdf8;
  --tile-empty:rgba(255,255,255,.22);
  --gold:#f2b632;
  --gold-deep:#b9780f;
  --wheel:rgba(255,255,255,.88);
  --sel:#e2573b;
  --sky1:#2f5d8a; --sky2:#e9a66b;
  --panel:#ffffff;
  --muted:#5b6478;
  --f-display:"Abril Fatface", Georgia, "Times New Roman", serif;
  --f-ui:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--sky1);color:var(--ink);font-family:var(--f-ui);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{
  position:relative;height:100%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--sky1) 0%,color-mix(in oklab,var(--sky1) 45%,var(--sky2)) 55%,var(--sky2) 100%);
  transition:background .6s;
}
.scene{position:absolute;inset:auto 0 0 0;height:42%;pointer-events:none;opacity:.55}
.screen{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.screen[hidden]{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;color:#fff;min-height:44px}
.bar .title{flex:1;min-width:0;text-align:center;line-height:1.1}
.bar .title b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.35rem;letter-spacing:.01em;text-wrap:balance}
.bar .title small{font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:focus-visible,.btn:focus-visible,.tool:focus-visible{outline:3px solid #fff;outline-offset:2px}
.coins{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:6px 12px 6px 6px;font-weight:900;font-variant-numeric:tabular-nums;flex:none}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,var(--gold) 55%,var(--gold-deep));box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:inline-block;flex:none}

/* grid */
.board{flex:1;min-height:0;display:grid;place-items:center;padding:8px 0}
.grid{position:relative}
.cell{position:absolute;border-radius:18%;background:var(--tile-empty);display:grid;place-items:center;
  font-weight:900;color:var(--ink);text-transform:uppercase;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.cell.on{background:var(--tile);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.cell.on span{animation:pop .35s ease-out both}
.cell.hint span{color:var(--gold-deep)}
.cell.flash{animation:flash .6s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes flash{50%{background:#ffe08a}}

/* preview */
.preview{height:46px;display:flex;justify-content:center;align-items:center}
.preview .pill{background:var(--sel);color:#fff;font-weight:900;font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 16px;border-radius:12px;min-width:20px;text-align:center}
.preview .pill.ok{background:#2e9b63}
.preview .pill.bonus{background:var(--gold-deep)}
.preview .pill.dup{background:#7a849a}
.preview .pill.bad{animation:shake .4s}
.toast{color:#fff;font-weight:800;font-size:.95rem;text-shadow:0 1px 2px rgba(0,0,0,.3)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* wheel row */
.play{display:grid;grid-template-columns:56px 1fr 56px;align-items:end;gap:6px}
.tools{display:flex;flex-direction:column;gap:12px;align-items:center}
.tool{position:relative;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tool .cost{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.68rem;font-weight:900;border-radius:99px;padding:1px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tool .badge{position:absolute;top:-4px;right:-4px;background:var(--sel);color:#fff;font-size:.7rem;font-weight:900;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.meter{position:absolute;left:4px;right:4px;bottom:4px;height:4px;border-radius:2px;background:rgba(0,0,0,.12);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.wheel{position:relative;justify-self:center;width:min(78vw,300px,38vh);aspect-ratio:1;max-width:100%;touch-action:none;cursor:pointer}
.wheel .disc{position:absolute;inset:0;border-radius:50%;background:var(--wheel);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.letter{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;
  font-weight:900;color:var(--ink);text-transform:uppercase;transition:background .12s,color .12s,left .35s,top .35s}
.letter.sel{background:var(--sel);color:#fff}

/* home */
.home{justify-content:flex-start;align-items:center;text-align:center;gap:14px;color:#fff;overflow-y:auto;padding-block:56px 24px}
.home > *{flex:none}
.home .tmap{width:min(380px,100%);padding:10px 10px 8px}
.home .tmap svg{max-height:36vh}
.home .tmap-head b{font-size:1.4rem}
.home .logo{font-size:clamp(2rem,10.5vw,3.6rem);line-height:1;white-space:nowrap}
.home .logo span{font-size:.3em;letter-spacing:.24em;margin-top:6px}
@media (max-width:600px), (max-height:820px){
  .home{gap:10px;padding-block:44px 14px}
  .home .tmap svg{max-height:28vh}
  .home .tmap-head b{font-size:1.2rem}
  .home .tmap-leg{font-size:.68rem;gap:4px 10px;margin-top:4px}
  .home .tmap-hint{display:none}
  .home .menu{gap:8px}
  .home .btn{padding:10px 14px;font-size:.98rem}
  .home .btn.primary{padding:13px;font-size:1.12rem}
}
.logo{font-family:var(--f-display);font-size:clamp(2.8rem,13vw,4.6rem);line-height:.95;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.logo span{display:block;font-family:var(--f-ui);font-weight:900;font-size:.3em;letter-spacing:.32em;text-transform:uppercase;margin-top:10px;opacity:.9}
.tagline{max-width:30ch;margin:0 auto;font-weight:700;opacity:.92;line-height:1.4}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-family:var(--f-ui);font-weight:900;font-size:1.05rem;cursor:pointer;
  background:var(--tile);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.primary{background:var(--gold);font-size:1.25rem;padding:18px}
.btn small{font-weight:700;opacity:.7;font-size:.8rem}
.btn[disabled]{opacity:.55;cursor:default}

/* trail */
.trail{overflow-y:auto;flex:1;min-height:0;padding:8px 0 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.stop{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.9);border-radius:16px;padding:10px 14px;border:0;font-family:var(--f-ui);text-align:left;color:var(--ink);cursor:pointer}
.stop[disabled]{background:rgba(255,255,255,.35);color:rgba(29,36,51,.6);cursor:default}
.stop .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.stop b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;display:block}
.stop small{font-size:.75rem;font-weight:700;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(29,36,51,.15)}
.dots i.done{background:#2e9b63}

/* overlay */
.overlay{position:absolute;inset:0;background:rgba(15,20,32,.55);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.overlay[hidden]{display:none!important}
.card{background:var(--panel);border-radius:22px;padding:22px 20px;width:min(380px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.card h2{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0 0 6px;text-wrap:balance}
.card p{line-height:1.45;margin:8px 0;color:var(--muted);font-weight:600}
.card .reward{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:1.3rem;margin:8px 0 14px}
.postcard{margin:14px 0;border-radius:14px;padding:16px;text-align:left;color:#fff;position:relative;overflow:hidden}
.postcard small{font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem;opacity:.9}
.postcard b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:2px 0 6px}
.postcard p{color:#fff;margin:0;font-weight:700}
.stamp{position:absolute;right:12px;top:12px;width:46px;height:54px;border:2px dashed rgba(255,255,255,.7);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem}
.bonus-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.bonus-list span{background:#f1ecdf;border-radius:8px;padding:4px 9px;font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em}
.card .btn{width:100%;margin-top:8px}
.rules{text-align:left;color:var(--muted);font-weight:600;line-height:1.5;padding-left:20px;margin:8px 0}
.rules li{margin:4px 0}

.stop .n.done{box-shadow:0 0 0 3px #2e9b63}
.stop .prog{font-weight:900;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prov{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 14px;border:0;font-family:var(--f-ui);text-align:left;color:var(--ink);cursor:pointer}
.prov[disabled]{background:rgba(255,255,255,.35);color:rgba(29,36,51,.55);cursor:default}
.prov .sig{width:44px;height:32px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:.06em;font-size:.85rem}
.prov[disabled] .sig{background:rgba(29,36,51,.35)}
.prov b{font-weight:900;font-size:1rem;display:block}
.prov small{font-size:.72rem;font-weight:700;color:var(--muted)}
.prov .st{font-weight:900;color:#2e9b63;font-size:1.1rem}
.prov.bonus{background:linear-gradient(135deg,#ffe08a,var(--gold));}
.prov.bonus .sig{background:var(--gold-deep)}
.prov.bonus[disabled]{background:rgba(255,224,138,.4)}
.region-head{color:#fff;text-align:center;padding:4px 0 6px}
.region-head p{margin:2px 0 0;font-weight:700;opacity:.9;font-size:.9rem}
.chest{font-size:0;width:64px;height:52px;margin:6px auto 2px;position:relative}
.chest::before{content:"";position:absolute;inset:18px 4px 0;border-radius:6px;background:linear-gradient(#a8642a,#7b4419);box-shadow:inset 0 0 0 3px #f2b632}
.chest::after{content:"";position:absolute;left:4px;right:4px;top:4px;height:18px;border-radius:14px 14px 4px 4px;background:linear-gradient(#c27a35,#9a5522);box-shadow:inset 0 0 0 3px #f2b632;transform-origin:bottom left;animation:lid .7s .2s ease-out both}
@keyframes lid{to{transform:rotate(-24deg) translateY(-4px)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0;text-align:left}
.album .postcard{margin:0;padding:12px;min-height:90px}
.album .postcard b{font-size:1.05rem}
.album .postcard p{font-size:.78rem;font-weight:700}
.album .locked{background:#e9e6df;color:#8a8f9c;border-radius:14px;padding:12px;font-weight:800;display:grid;place-items:center;min-height:90px;text-align:center;font-size:.85rem}
.btn.hunt{background:linear-gradient(135deg,#2a2350,#5b3a8a);color:#fff}
.btn.hunt small{opacity:.85}
.cell.tok{box-shadow:inset 0 0 0 2.5px var(--gold)}
.cell.tok::after{content:"";position:absolute;top:12%;right:12%;width:22%;height:22%;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.cell.got{animation:got .7s}
@keyframes got{40%{background:var(--gold);transform:scale(1.15)}}
.hunt-card{background:linear-gradient(180deg,#1b1733,#2c2450 60%,#171329);color:#fff;text-align:center}
.hunt-card h2{color:#fff;letter-spacing:.02em}
.hunt-card p{color:rgba(255,255,255,.8)}
.hunt-time{display:inline-flex;gap:6px;align-items:center;font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);border-radius:99px;padding:4px 14px;margin:4px 0 8px}
.hunt-theme{font-family:var(--f-display);font-size:1.6rem;margin:10px 0 2px;color:#ffd66b}
.hwords{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:center;margin:14px 0}
.hword{display:flex;gap:4px}
.hword i{width:24px;height:28px;border-radius:6px;background:#8d8a9c;display:grid;place-items:center;font-style:normal;font-weight:900;text-transform:uppercase;color:var(--ink);font-size:.95rem}
.hword i.on{background:var(--gold)}
.hword.done i{background:#7fd1a1}
.hbar{position:relative;height:26px;border-radius:99px;background:#0d0b18;border:2px solid #fff;margin:18px 30px 14px 0}
.hbar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#f2b632,#ffd66b);transition:width .4s}
.hbar .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.85rem;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.hbar .ms{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#0d0b18;border:2px solid #fff;display:grid;place-items:center;font-size:.6rem;font-weight:900}
.hbar .ms.ok{background:#2e9b63}
.hbar .gift{position:absolute;right:-30px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:8px;background:#b54be0;box-shadow:inset 0 0 0 0 transparent}
.hbar .gift::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px;background:var(--gold)}
.hbar .gift::after{content:"";position:absolute;left:0;right:0;top:14px;height:7px;background:var(--gold)}
.hbar .gift.ok{background:#2e9b63}
.hunt-rew{font-size:.8rem;color:rgba(255,255,255,.75);font-weight:700}
.hunt-card .btn.primary{background:#19c6e0;color:#08303a}
.cityinfo{text-align:left;margin:12px 0;border-radius:16px;background:#f3f1ec;overflow:hidden}
.cityinfo .map{background:#dbe7f0;display:flex;justify-content:center;padding:10px 0 4px}
.cityinfo .map svg{height:210px;width:auto;max-width:100%}
.cityinfo .txt{padding:12px 14px 14px}
.cityinfo small{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.66rem;color:var(--muted)}
.cityinfo b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:2px 0 4px;color:var(--ink)}
.cityinfo p{margin:0;color:#3a4152;font-weight:600;font-size:.92rem;line-height:1.5;text-align:left}
.cityinfo .where{margin-top:8px;font-size:.8rem;color:var(--muted)}
.provrow{display:flex;gap:8px;align-items:stretch}
.provrow .prov{flex:1;min-width:0}
.infobtn{flex:none;width:52px;border:0;border-radius:14px;background:rgba(255,255,255,.92);color:var(--ink);font-family:var(--f-display);font-size:1.3rem;cursor:pointer}
@keyframes ping{0%{r:14;opacity:.8}100%{r:46;opacity:0}}
.ping{animation:ping 1.6s ease-out infinite}
.viewmode .wheel{opacity:.35;pointer-events:none}
.viewmode #shuffleBtn,.viewmode #hintBtn,.viewmode #rocketBtn{opacity:.35;pointer-events:none}
.preview .btn.replay{padding:8px 18px;font-size:.95rem;width:auto}
.tmap{box-sizing:border-box;background:rgba(255,255,255,.92);border-radius:18px;padding:12px 12px 10px;flex:none}
.tmap-head{display:flex;gap:18px;justify-content:center;margin-bottom:4px}
.tmap-head b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tmap-head small{font-family:var(--f-ui);font-weight:800;font-size:.75rem;color:var(--muted);margin-left:2px}
.tmap svg{display:block;width:100%;max-height:52vh;height:auto}
.tmap path.tap{cursor:pointer}
.tmap path.tap:hover{filter:brightness(1.08)}
.tmap path.curp{animation:curp 1.6s ease-in-out infinite}
@keyframes curp{50%{fill:#ffd66b}}
.tmap-leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.75rem;font-weight:800;color:var(--muted);margin-top:6px}
.tmap-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;box-shadow:inset 0 0 0 1px #c9c4b8}
.tmap-hint{margin:6px 0 0;text-align:center;font-size:.75rem;font-weight:700;color:var(--muted)}
.qnum{font-size:.8rem;margin:10px 0 2px!important}
.qtext{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.25;margin:4px 0 10px;color:var(--ink);text-wrap:balance}
.card .btn.qopt{justify-content:flex-start;text-align:left;font-size:1rem;padding:13px 16px;background:#f3f1ec}
.card .btn.qopt:disabled{cursor:default}
.card .btn.qopt.ok{background:#2e9b63;color:#fff;opacity:1}
.card .btn.qopt.ko{background:#e2573b;color:#fff;opacity:1}
.card .btn.qopt:disabled:not(.ok):not(.ko){opacity:.55}
.qfeed{font-weight:800!important;margin:12px 0 4px!important}
.qfeed.okt{color:#2e9b63!important}.qfeed.kot{color:#c2412a!important}
.tmap-hint.blink{display:block!important;color:#c2412a!important;font-weight:900!important;animation:hb .5s 3}
@keyframes hb{50%{opacity:.2}}
.qreview{text-align:left;display:flex;flex-direction:column;gap:10px;margin:12px 0}
.qreview div{background:#f3f1ec;border-radius:12px;padding:10px 12px}
.qreview p{margin:0 0 4px!important;font-size:.9rem}
.qreview b{color:#2e9b63}
.bonus-tag{display:inline-block;background:var(--gold);color:var(--ink);border-radius:99px;padding:2px 10px;font-weight:900;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <svg class="scene" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 130 L60 90 L110 120 L170 70 L230 115 L290 80 L350 110 L400 85 L400 200 L0 200Z" fill="rgba(255,255,255,.18)"/>
    <path d="M0 160 Q100 125 200 150 T400 140 L400 200 L0 200Z" fill="rgba(0,0,0,.12)"/>
  </svg>

  <!-- HOME -->
  <section class="screen home" id="home">
    <div class="coins" style="position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px))"><i class="coin"></i><span class="coinval">0</span></div>
    <h1 class="logo">ITALYWORDS<span>Il giro d'Italia delle parole</span></h1>
    <div id="homeMap" style="width:min(380px,100%)"></div>
    <div class="menu">
      <button class="btn primary" id="playBtn" type="button">Gioca</button>
      <button class="btn hunt" id="huntBtn" type="button" hidden>Caccia alle lettere</button>

const CITY = {
AO:["Aosta","Ai piedi delle Alpi, alla confluenza tra la Dora Baltea e il Buthier, Aosta fu fondata dai Romani come Augusta Praetoria. Conserva ancora l'Arco di Augusto, la Porta Pretoria e il teatro romano. È l'unico capoluogo della regione più piccola d'Italia, dove si parlano italiano e francese."],
TO:["Torino","Adagiata sul Po con le Alpi sullo sfondo, Torino è stata la prima capitale d'Italia. Il simbolo è la Mole Antonelliana, che ospita il Museo del Cinema. Città della Fiat e dell'industria automobilistica, è famosa anche per il Museo Egizio, il caffè e il cioccolato gianduja."],
VC:["Vercelli","Nel cuore della pianura piemontese, Vercelli è circondata da distese di risaie che in primavera, allagate, sembrano un mare a quadretti. È tra le capitali europee del riso. La Basilica di Sant'Andrea, del Duecento, è uno dei primi esempi di gotico in Italia."],
BI:["Biella","Ai piedi delle Prealpi, Biella è da secoli la capitale italiana della lana e dei tessuti pregiati. Lungo i torrenti sono nati lanifici famosi in tutto il mondo. Sopra la città sorge il Santuario di Oropa, meta di pellegrinaggi da tutto il Piemonte."],
NO:["Novara","Tra il Ticino e il Sesia, Novara è una città di pianura a pochi chilometri dalla Lombardia. Il suo simbolo è l'altissima cupola della Basilica di San Gaudenzio, progettata da Alessandro Antonelli, lo stesso architetto della Mole di Torino. Intorno si stendono risaie e campi."],
VB:["Verbania","Affacciata sulla sponda piemontese del Lago Maggiore, Verbania è il capoluogo più a nord del Piemonte. È famosa per i Giardini Botanici di Villa Taranto e per il clima mite che fa fiorire camelie e azalee. Dal lungolago si vedono le Isole Borromee."],
AT:["Asti","Tra le colline del Monferrato e delle Langhe, Asti è terra di vini come la Barbera e l'Asti spumante. Ogni settembre ospita il Palio, una corsa di cavalli tra borghi e rioni con origini medievali. Il centro conserva torri e palazzi nobiliari."],
AL:["Alessandria","Tra i fiumi Tanaro e Bormida, Alessandria fu fondata nel 1168 e prese il nome da papa Alessandro III. Per secoli fu una città fortezza: la sua Cittadella a forma di stella è tra le più grandi d'Europa. È anche la patria dei cappelli Borsalino."],
CN:["Cuneo","Costruita su un altopiano a forma di cuneo tra lo Stura e il Gesso, da cui prende il nome, Cuneo è chiamata la città dei sette assedi. La grande piazza Galimberti e i lunghi portici del centro la rendono elegante. È la porta delle valli alpine del Piemonte sud-occidentale."],
IM:["Imperia","Sulla Riviera di Ponente, Imperia nacque nel 1923 dall'unione di Porto Maurizio e Oneglia. È la capitale dell'olio extravergine d'oliva ligure e della varietà taggiasca. Dalle sue colline terrazzate a ulivi si scende fino al mare e ai porticcioli."],
SV:["Savona","Sulla Riviera ligure, Savona ha un porto importante e un simbolo antico: la Torretta, detta Torre Leon Pancaldo. La Fortezza del Priamar domina il mare. Diede i natali a due papi della famiglia della Rovere, Sisto IV e Giulio II."],
GE:["Genova","Capoluogo della Liguria e grande porto del Mediterraneo, Genova fu una potente Repubblica marinara. Il suo centro storico, fatto di stretti carruggi, è tra i più estesi d'Europa. La Lanterna, il faro della città, è uno dei più antichi ancora in funzione."],
SP:["La Spezia","In fondo all'omonimo golfo, chiamato anche Golfo dei Poeti, La Spezia è sede di un'importante base della Marina Militare. Dalla città si raggiungono facilmente le Cinque Terre e Portovenere. Il Museo Tecnico Navale racconta la storia della marina italiana."],
PV:["Pavia","Sulle rive del Ticino, Pavia fu capitale del regno longobardo. La sua università, una delle più antiche d'Europa, ebbe studenti come Alessandro Volta. Il Ponte Coperto e, poco fuori città, la splendida Certosa di Pavia sono i suoi simboli."],
LO:["Lodi","Sulla riva dell'Adda, nella Bassa lombarda, Lodi fu rifondata nel 1158 da Federico Barbarossa. Il Tempio civico dell'Incoronata è un gioiello del Rinascimento. Il territorio è famoso per l'agricoltura, l'allevamento e i formaggi come il Grana Padano."],
MI:["Milano","Capoluogo della Lombardia, Milano è il cuore economico e finanziario d'Italia e una capitale mondiale della moda e del design. Il Duomo, con le sue guglie, domina la piazza principale. Ospita il Cenacolo di Leonardo e il Teatro alla Scala."],
MB:["Monza","A nord di Milano, Monza è il capoluogo della Brianza. È nota in tutto il mondo per l'Autodromo, dove si corre il Gran Premio d'Italia di Formula 1. Il suo Parco, con la Villa Reale, è uno dei parchi recintati più grandi d'Europa."],
VA:["Varese","Chiamata la città giardino per i suoi parchi e le ville, Varese sorge tra i laghi prealpini. Il Sacro Monte, con le sue cappelle lungo la salita, è Patrimonio UNESCO. Dalle colline si vedono il Lago di Varese e, nei giorni limpidi, il Monte Rosa."],
CO:["Como","Sulla punta sud-occidentale del lago omonimo, Como è circondata da montagne e ville storiche. È la città natale di Alessandro Volta, inventore della pila, a cui è dedicato il Tempio Voltiano. Da secoli è la capitale italiana della seta."],
LC:["Lecco","Sul ramo orientale del Lago di Como, Lecco è dominata dal profilo del Resegone. È la città dei Promessi Sposi: Alessandro Manzoni vi trascorse l'infanzia e ambientò qui il romanzo. È un punto di partenza per arrampicate ed escursioni."],
SO:["Sondrio","Nel cuore della Valtellina, lungo il fiume Adda, Sondrio è circondata da vigneti terrazzati e montagne. Il territorio è famoso per i pizzoccheri, la bresaola e il formaggio Bitto. Da qui si raggiungono località sciistiche come Bormio e Livigno."],
BG:["Bergamo","Bergamo è divisa in due: la Città Alta, sul colle, chiusa dalle mura veneziane Patrimonio UNESCO, e la Città Bassa, più moderna. Le due parti sono collegate da una funicolare. È la città del compositore Gaetano Donizetti e della polenta."],
BS:["Brescia","Seconda città della Lombardia per abitanti, Brescia conserva il Capitolium romano e il complesso di Santa Giulia, Patrimonio UNESCO. Il suo territorio va dal Lago di Garda alla Franciacorta, terra di bollicine. È un grande centro industriale e meccanico."],
CR:["Cremona","Sulla riva del Po, Cremona è la capitale mondiale della liuteria: qui lavorarono Antonio Stradivari e gli Amati. Il Torrazzo, campanile del Duomo, è tra le torri in muratura più alte d'Europa. È famosa anche per il torrone e la mostarda."],
MN:["Mantova","Circondata su tre lati da laghi formati dal Mincio, Mantova fu la capitale dei Gonzaga. Palazzo Ducale e Palazzo Te sono capolavori del Rinascimento, e la città è Patrimonio UNESCO insieme a Sabbioneta. Tipici sono i tortelli di zucca."],
TN:["Trento","Lungo l'Adige e circondata dalle montagne, Trento ospitò il Concilio di Trento nel Cinquecento. Il Castello del Buonconsiglio e il Duomo sono i suoi monumenti principali. È sede di un'università prestigiosa e del museo delle scienze MUSE."],
BZ:["Bolzano","Alla confluenza tra Isarco e Talvera, Bolzano è una città bilingue, italiana e tedesca. È la porta delle Dolomiti, Patrimonio UNESCO. Al Museo archeologico è conservato Ötzi, l'uomo venuto dal ghiaccio. Il mercatino di Natale è tra i più famosi d'Italia."],
VR:["Verona","Attraversata dall'Adige, Verona è la città di Romeo e Giulietta. L'Arena, anfiteatro romano, ospita ogni estate una celebre stagione lirica. Il centro storico è Patrimonio UNESCO e il Lago di Garda è a pochi chilometri."],
VI:["Vicenza","Vicenza è la città dell'architetto Andrea Palladio: la Basilica Palladiana, il Teatro Olimpico e le ville palladiane del territorio sono Patrimonio UNESCO. È un importante centro dell'oreficeria. Piatto tipico è il baccalà alla vicentina."],
PD:["Padova","Padova ospita una delle università più antiche del mondo, dove insegnò Galileo Galilei. La Cappella degli Scrovegni è affrescata da Giotto. La Basilica di Sant'Antonio attira pellegrini da ovunque, e Prato della Valle è tra le piazze più grandi d'Europa."],
RO:["Rovigo","Tra l'Adige e il Po, Rovigo è il capoluogo del Polesine, una terra piatta di campi e canali. A sud si apre il Delta del Po, un'area naturale ricca di uccelli e lagune. Il Tempio della Beata Vergine del Soccorso, detto la Rotonda, è il suo simbolo."],
VE:["Venezia","Costruita su isolette nella laguna, Venezia è attraversata dal Canal Grande e da centinaia di canali e ponti. Fu la capitale della Serenissima Repubblica. Piazza San Marco, la Basilica e il Palazzo Ducale sono tra i luoghi più visitati al mondo."],
TV:["Treviso","Attraversata dal Sile e da canali che scorrono tra le case, Treviso ha un centro elegante circondato da mura. Il suo territorio è la patria del Prosecco e del radicchio rosso. Qui sono nate aziende famose dell'abbigliamento e dello sport."],
BL:["Belluno","Lungo il Piave e circondata dalle Dolomiti, Belluno è il capoluogo più montano del Veneto. Dalla provincia si raggiunge Cortina d'Ampezzo. Il territorio è famoso per l'occhialeria, nata nel Cadore, e per il Parco nazionale delle Dolomiti Bellunesi."],
PN:["Pordenone","Sul fiume Noncello, nella pianura friulana occidentale, Pordenone ha un centro storico con un lungo corso porticato e palazzi affrescati. È un polo industriale importante, soprattutto per gli elettrodomestici. Ospita una nota rassegna letteraria, Pordenonelegge."],
UD:["Udine","Nel cuore del Friuli, Udine è dominata dal colle del Castello. Piazza della Libertà, con la sua loggia veneziana, è tra le piazze più belle d'Italia. Nelle sale dell'Arcivescovado si ammirano gli affreschi di Giambattista Tiepolo."],
GO:["Gorizia","Al confine con la Slovenia, Gorizia è unita alla vicina Nova Gorica in un'unica area urbana. Nel 2025 le due città sono state insieme Capitale europea della cultura. Il Castello medievale domina la città, segnata dalle battaglie dell'Isonzo."],
TS:["Trieste","Affacciata sull'Adriatico, Trieste fu per secoli il grande porto dell'Impero austro-ungarico. Piazza Unità d'Italia, aperta sul mare, è tra le più grandi piazze affacciate sull'acqua in Europa. È famosa per i caffè letterari e per la Barcolana, una grande regata."],
PC:["Piacenza","Sulla riva del Po, al confine con la Lombardia, Piacenza è la prima città dell'Emilia lungo la via Emilia. Piazza dei Cavalli, con le statue equestri dei Farnese, è il suo cuore. Le colline intorno producono vini e salumi come la coppa piacentina."],
PR:["Parma","Parma è famosa nel mondo per il Parmigiano Reggiano e il prosciutto. Fu capitale di un ducato con i Farnese e poi con Maria Luigia d'Austria. Il Duomo con la cupola affrescata dal Correggio e il Teatro Regio sono i suoi tesori."],
RE:["Reggio Emilia","Lungo la via Emilia, Reggio Emilia è la città dove nel 1797 nacque il Tricolore, la bandiera italiana. È nota per un metodo educativo per l'infanzia studiato in tutto il mondo. Il territorio produce Parmigiano Reggiano e Lambrusco."],
MO:["Modena","Modena è la patria dell'aceto balsamico tradizionale e della Ferrari, nata nella vicina Maranello. Il Duomo romanico, la Torre Ghirlandina e Piazza Grande sono Patrimonio UNESCO. Qui nacque il tenore Luciano Pavarotti."],
BO:["Bologna","Capoluogo dell'Emilia-Romagna, Bologna è chiamata la Dotta, la Grassa e la Rossa: per la sua antica università, la cucina e il colore dei tetti. Ha quasi 40 chilometri di portici, Patrimonio UNESCO. Le Due Torri sono il suo simbolo."],
FE:["Ferrara","Ferrara fu la città degli Este, che vi costruirono il grande Castello circondato dal fossato. Il centro rinascimentale, con le mura percorribili in bicicletta, è Patrimonio UNESCO. È considerata una delle città più ciclabili d'Italia."],
RA:["Ravenna","Ravenna fu capitale dell'Impero romano d'Occidente e poi del regno di Teodorico. I suoi mosaici bizantini, come quelli di San Vitale, sono Patrimonio UNESCO. Qui si trova la tomba di Dante Alighieri."],
FC:["Forlì","Lungo la via Emilia, Forlì è il capoluogo della provincia insieme a Cesena. Il centro ruota intorno alla grande Piazza Saffi. In città si trovano i Musei San Domenico, che ospitano grandi mostre d'arte. Le colline vicine portano all'Appennino romagnolo."],
RN:["Rimini","Sulla costa adriatica, Rimini è una delle capitali del turismo balneare italiano. Conserva monumenti romani come l'Arco d'Augusto e il Ponte di Tiberio. Qui nacque il regista Federico Fellini, che raccontò la città nei suoi film."],
MS:["Massa","Tra le Alpi Apuane e il mare, Massa è il capoluogo della provincia insieme alla vicina Carrara. Dalle Apuane si estrae il celebre marmo bianco. La Rocca Malaspina e il Palazzo Ducale ricordano i signori che governarono la città."],
LU:["Lucca","Lucca è racchiusa da mura rinascimentali intatte, su cui si passeggia e si pedala. Piazza dell'Anfiteatro ha la forma dell'antico anfiteatro romano. Qui nacque Giacomo Puccini, e ogni autunno la città ospita il festival Lucca Comics & Games."],
PT:["Pistoia","Pistoia ha una bella piazza del Duomo con il battistero a strisce bianche e verdi. Il territorio è uno dei più grandi centri vivaistici d'Europa, con chilometri di piante e alberi. Nel 2017 è stata Capitale italiana della cultura."],
PO:["Prato","Seconda città della Toscana per abitanti, Prato è da secoli un grande distretto tessile, famoso per il riciclo della lana. Il Castello dell'Imperatore fu costruito da Federico II. Sono tipici i cantucci, biscotti alle mandorle."],
FI:["Firenze","Culla del Rinascimento, Firenze fu la città dei Medici. La cupola del Brunelleschi, gli Uffizi, Ponte Vecchio e il David di Michelangelo la rendono unica al mondo. È attraversata dall'Arno e il suo centro storico è Patrimonio UNESCO."],
PI:["Pisa","Pisa fu una delle quattro Repubbliche marinare. In Piazza dei Miracoli si trovano il Duomo, il Battistero e la famosa Torre pendente. Qui nacque Galileo Galilei, e la città ospita università di prestigio come la Scuola Normale Superiore."],
LI:["Livorno","Affacciata sul Tirreno, Livorno ha uno dei porti più importanti d'Italia. Il quartiere della Venezia Nuova è attraversato da canali chiamati fossi, e la Terrazza Mascagni guarda il mare. Piatto tipico è il cacciucco, zuppa di pesce."],
SI:["Siena","Siena ha uno dei centri medievali meglio conservati d'Europa, Patrimonio UNESCO. Piazza del Campo, a forma di conchiglia, ospita due volte l'anno il Palio tra le contrade. La Torre del Mangia e il Duomo a strisce sono i suoi simboli."],
AR:["Arezzo","Arezzo fu una città etrusca e poi romana. Nella Basilica di San Francesco si trovano gli affreschi di Piero della Francesca. Piazza Grande ospita la Giostra del Saracino e una grande fiera antiquaria. È un centro importante dell'oreficeria."],
GR:["Grosseto","Grosseto è il capoluogo della Maremma, terra di butteri, cavalli e pinete. Il centro è chiuso da mura medicee a forma di esagono. Vicino alla città si trova il Parco della Maremma, con spiagge selvagge e colline che scendono al mare."],
PG:["Perugia","Su una collina affacciata sulla valle del Tevere, Perugia ha origini etrusche. Corso Vannucci e la Fontana Maggiore sono il suo cuore. È famosa per il cioccolato, con il festival Eurochocolate, e per Umbria Jazz."],
TR:["Terni","Terni è stata a lungo la città dell'acciaio, con grandi acciaierie. Poco lontano si trova la Cascata delle Marmore, una delle più alte d'Europa, creata dai Romani. La città festeggia San Valentino, suo patrono e vescovo."],
PU:["Pesaro","Sull'Adriatico, Pesaro è il capoluogo insieme a Urbino. Qui nacque il compositore Gioachino Rossini, celebrato ogni anno con il Rossini Opera Festival. Nel 2024 è stata Capitale italiana della cultura. È nota anche per la produzione di mobili."],
AN:["Ancona","Capoluogo delle Marche, Ancona sorge su un promontorio a forma di gomito, da cui il nome greco. Il suo porto collega l'Italia con la Croazia e la Grecia. Dalla Cattedrale di San Ciriaco si vede il mare, e poco a sud inizia la Riviera del Conero."],
MC:["Macerata","Su una collina tra le valli del Chienti e del Potenza, Macerata è una città universitaria. Ogni estate lo Sferisterio, una grande arena neoclassica, ospita una stagione d'opera all'aperto. Qui nacque il gesuita Matteo Ricci, missionario in Cina."],
FM:["Fermo","Fermo sorge su un colle a pochi chilometri dall'Adriatico. In piazza del Popolo si affacciano palazzi rinascimentali, e sotto la città si trovano grandi cisterne romane. Il territorio è uno dei principali distretti italiani della calzatura."],
AP:["Ascoli Piceno","Ascoli Piceno è chiamata la città delle cento torri ed è costruita in travertino. Piazza del Popolo è una delle più belle d'Italia. È famosa per le olive all'ascolana, ripiene e fritte, e per la Quintana, una giostra in costume."],
VT:["Viterbo","Viterbo è chiamata la città dei papi: nel Duecento il Palazzo dei Papi ospitò diverse elezioni pontificie. Il quartiere medievale di San Pellegrino è tra i meglio conservati d'Italia. Intorno ci sono terme e il Lago di Bolsena."],
RI:["Rieti","Rieti è considerata il centro geografico d'Italia, chiamata per questo Umbilicus Italiae. Si trova in una conca circondata dai monti, con il Terminillo vicino. Nella valle santa reatina San Francesco realizzò il primo presepe a Greccio."],
RM:["Roma","Capitale d'Italia, Roma è chiamata la Città Eterna. Il Colosseo, i Fori, il Pantheon e la Fontana di Trevi raccontano quasi tremila anni di storia. Al suo interno si trova lo Stato della Città del Vaticano, con San Pietro."],
LT:["Latina","Latina fu fondata nel 1932 con il nome di Littoria, dopo la bonifica delle Paludi Pontine. È una delle città più giovani d'Italia, con un'architettura del Novecento. Vicino si trovano il Parco del Circeo e le isole Ponziane."],
FR:["Frosinone","Capoluogo della Ciociaria, Frosinone sorge su un colle nella valle del Sacco. Il territorio è ricco di abbazie, come Montecassino e Casamari. Il nome Ciociaria viene dalle ciocie, le tradizionali calzature dei contadini."],
AQ:["L'Aquila","Capoluogo dell'Abruzzo, L'Aquila sorge tra le montagne del Gran Sasso. La Basilica di Collemaggio custodisce la Perdonanza, una tradizione voluta da papa Celestino V. Dopo il terremoto del 2009 la città è stata in gran parte ricostruita."],
TE:["Teramo","Tra i fiumi Tordino e Vezzola, Teramo si trova tra il Gran Sasso e l'Adriatico. Conserva i resti di un teatro romano e un Duomo medievale. Piatto tipico sono le virtù, una minestra che si prepara il primo maggio."],
PE:["Pescara","Alla foce del fiume omonimo, Pescara è la città più popolosa dell'Abruzzo e una vivace località balneare. Qui nacque il poeta Gabriele D'Annunzio, di cui si visita la casa natale. È famosa per gli arrosticini, spiedini di carne di pecora."],
CH:["Chieti","Su un colle tra la Maiella e il mare, Chieti è una delle città più antiche d'Abruzzo. Il Museo archeologico conserva il Guerriero di Capestrano, statua simbolo della regione. La processione del Venerdì Santo è una delle più antiche d'Italia."],
IS:["Isernia","Isernia è uno dei capoluoghi più piccoli d'Italia. Vicino alla città è stato scoperto un sito paleolitico di circa 600.000 anni fa, tra i più antichi d'Europa. La Fontana Fraterna è il suo monumento simbolo."],
CB:["Campobasso","Capoluogo del Molise, Campobasso si estende ai piedi del Castello Monforte. Per il Corpus Domini la Sagra dei Misteri porta in processione strutture di ferro con figure viventi sospese nell'aria. Il centro antico sale a gradoni verso il castello."],
CE:["Caserta","Caserta è famosa per la Reggia dei Borbone, una delle residenze reali più grandi del mondo, con un parco e cascate monumentali. È Patrimonio UNESCO insieme all'Acquedotto Carolino e a San Leucio. Il territorio produce la mozzarella di bufala."],
BN:["Benevento","Benevento fu un'importante città sannita e romana. Conserva l'Arco di Traiano, tra i meglio conservati d'Italia, e la chiesa longobarda di Santa Sofia, Patrimonio UNESCO. Secondo la leggenda è la città delle streghe, da cui il liquore Strega."],
NA:["Napoli","Capoluogo della Campania, Napoli si affaccia sul golfo con il Vesuvio sullo sfondo. Il suo centro storico è tra i più grandi d'Europa ed è Patrimonio UNESCO. È la patria della pizza, del caffè e della canzone napoletana."],
AV:["Avellino","Avellino sorge in una conca dell'Irpinia, circondata da montagne e boschi. Il territorio è famoso per vini come il Taurasi, il Fiano e il Greco di Tufo. Vicino si trova il Santuario di Montevergine."],
SA:["Salerno","Salerno è affacciata sul golfo omonimo, tra la Costiera Amalfitana e il Cilento. Nel Medioevo ospitò la Scuola Medica Salernitana, la prima scuola di medicina d'Europa. Le sue Luci d'Artista illuminano la città d'inverno."],
FG:["Foggia","Foggia è il capoluogo del Tavoliere, la grande pianura della Puglia chiamata granaio d'Italia per il frumento. Dalla provincia si raggiungono il Gargano e le Isole Tremiti. Il centro conserva i resti di un palazzo di Federico II."],
BT:["Barletta","Barletta è uno dei tre capoluoghi della provincia, insieme ad Andria e Trani. È famosa per la Disfida di Barletta del 1503 e per il Colosso, una grande statua di bronzo. Il Castello svevo domina il porto."],
BA:["Bari","Capoluogo della Puglia, Bari è un grande porto sull'Adriatico. Bari Vecchia, con le sue stradine, custodisce la Basilica di San Nicola, venerato anche dagli ortodossi. Per strada si vedono le signore che fanno le orecchiette a mano."],
TA:["Taranto","Taranto è chiamata la città dei due mari, il Mar Grande e il Mar Piccolo. Fondata dagli Spartani, fu una ricca colonia della Magna Grecia. Il Museo Archeologico MArTA conserva gli Ori di Taranto. È sede di una grande base navale."],
BR:["Brindisi","Brindisi ha un porto naturale profondo che per secoli è stato la porta verso l'Oriente. Qui finiva la via Appia, segnata da una colonna romana sul lungomare. Dal porto partono i traghetti per la Grecia."],
LE:["Lecce","Lecce è chiamata la Firenze del Sud per le sue chiese e palazzi barocchi, scolpiti nella pietra leccese, morbida e dorata. In piazza Sant'Oronzo si trova un anfiteatro romano. È il capoluogo del Salento, tra due mari."],
PZ:["Potenza","Capoluogo della Basilicata, Potenza è tra i capoluoghi più alti d'Italia, a oltre 800 metri. Per collegare i quartieri in salita ha alcune delle scale mobili urbane più lunghe d'Europa. A maggio si celebra la Sfilata dei Turchi."],
MT:["Matera","Matera è famosa nel mondo per i Sassi, antichi rioni scavati nella roccia, Patrimonio UNESCO dal 1993. È tra le città abitate più antiche del mondo. Nel 2019 è stata Capitale europea della cultura, e molti film vi sono stati girati."],
CS:["Cosenza","Alla confluenza tra il Crati e il Busento, Cosenza ha una città vecchia sul colle e una parte moderna in pianura. Secondo la leggenda il re goto Alarico fu sepolto con il suo tesoro nel letto del Busento. Vicino si trova la Sila."],
KR:["Crotone","Crotone fu una ricca colonia della Magna Grecia, dove Pitagora fondò la sua scuola. Del santuario di Hera Lacinia, a Capo Colonna, resta una sola colonna dorica. Il mare è protetto dall'Area marina di Capo Rizzuto."],
CZ:["Catanzaro","Capoluogo della Calabria, Catanzaro sorge su un'altura tra due mari, lo Ionio e il Tirreno, nel punto in cui la penisola è più stretta. Il Ponte Bisantis è tra gli archi in cemento armato più grandi del mondo. Piatto tipico è il morzello."],
VV:["Vibo Valentia","Vibo Valentia sorge su un'altura affacciata sul Golfo di Sant'Eufemia, sul Tirreno. Fu la colonia greca di Hipponion. Dalla provincia si raggiungono Tropea e Capo Vaticano, con il mare cristallino della Costa degli Dei."],
RC:["Reggio Calabria","Sulla punta dello Stivale, Reggio Calabria guarda la Sicilia attraverso lo Stretto di Messina. Il lungomare è stato definito il chilometro più bello d'Italia. Il Museo Archeologico Nazionale custodisce i Bronzi di Riace."],
ME:["Messina","Messina si affaccia sullo Stretto, a pochi chilometri dalla Calabria. Il campanile del Duomo ospita uno dei più grandi orologi astronomici del mondo. Fu quasi distrutta dal terremoto del 1908 e poi ricostruita."],
CT:["Catania","Catania sorge ai piedi dell'Etna ed è stata ricostruita più volte dopo eruzioni e terremoti. Il centro barocco, con la pietra lavica scura, è Patrimonio UNESCO. Il suo simbolo è l'elefante di pietra lavica, detto u Liotru."],
SR:["Siracusa","Siracusa fu una delle città più potenti della Magna Grecia e la patria di Archimede. Il Teatro greco ospita ancora oggi rappresentazioni classiche. L'isola di Ortigia è il cuore antico della città, Patrimonio UNESCO."],
RG:["Ragusa","Ragusa è divisa in Ragusa Superiore e Ragusa Ibla, ricostruita in stile barocco dopo il terremoto del 1693. Il suo centro è Patrimonio UNESCO insieme ad altre città del Val di Noto. Molte scene del commissario Montalbano sono state girate qui."],
EN:["Enna","Enna, al centro della Sicilia, è il capoluogo di provincia più alto d'Italia, a quasi mille metri. È chiamata il belvedere della Sicilia. Dal Castello di Lombardia si vede l'Etna. Vicino si trova la Villa romana del Casale, con i suoi mosaici."],
CL:["Caltanissetta","Al centro della Sicilia, Caltanissetta fu per secoli una capitale dell'estrazione dello zolfo. Le miniere hanno segnato la storia e il paesaggio della zona. Durante la Settimana Santa la città celebra solenni processioni."],
AG:["Agrigento","Agrigento è famosa per la Valle dei Templi, uno dei complessi archeologici greci più grandi del mondo e Patrimonio UNESCO. Il Tempio della Concordia è tra i meglio conservati. Qui nacque lo scrittore Luigi Pirandello."],
TP:["Trapani","Trapani sorge su una sottile lingua di terra protesa nel mare, da cui partono i traghetti per le Isole Egadi. Le saline, con i mulini a vento, colorano il tramonto. Sopra la città si trova il borgo medievale di Erice."],
PA:["Palermo","Capoluogo della Sicilia, Palermo fu capitale sotto Arabi e Normanni. Il percorso arabo-normanno, con la Cattedrale e la Cappella Palatina, è Patrimonio UNESCO. I mercati come Ballarò e il cibo di strada, come arancine e panelle, sono famosi."],
SS:["Sassari","Sassari è la seconda città della Sardegna per abitanti. Ogni anno ospita la Cavalcata Sarda e la Discesa dei Candelieri, grandi ceri di legno portati per le strade. Dalla provincia si raggiungono Alghero e la Riviera del Corallo."],
OT:["Olbia","Olbia è la porta di ingresso del nord-est della Sardegna, con un grande porto e un aeroporto. La provincia comprende la Gallura e la Costa Smeralda, con le sue spiagge famose. Il capoluogo è condiviso con Tempio Pausania."],
NU:["Nuoro","Nel cuore della Barbagia, Nuoro è chiamata l'Atene sarda per i suoi artisti e scrittori. Qui nacque Grazia Deledda, Premio Nobel per la letteratura nel 1926. Sopra la città si alza il Monte Ortobene."],
OG:["Tortolì","Tortolì, insieme a Lanusei, è il capoluogo dell'Ogliastra, sulla costa orientale della Sardegna. L'Ogliastra è nota per il gran numero di centenari tra i suoi abitanti. Le rocce rosse di Arbatax si tuffano nel mare."],
OR:["Oristano","Oristano fu la capitale del Giudicato di Arborea, governato da Eleonora d'Arborea. Ogni Carnevale ospita la Sartiglia, una giostra equestre in maschera. Vicino si trovano lo stagno di Cabras e le rovine di Tharros."],
VS:["Sanluri","Sanluri, insieme a Villacidro, è il capoluogo del Medio Campidano, una pianura fertile della Sardegna sud-occidentale. Il suo castello medievale è uno dei pochi ancora abitabili dell'isola. Il territorio è famoso per il pane e il grano."],
SU:["Carbonia","Carbonia, insieme a Iglesias, è il capoluogo del Sulcis Iglesiente. Fu fondata nel 1938 per i minatori del carbone. Il territorio è ricco di antiche miniere e di coste spettacolari, come lo scoglio del Pan di Zucchero."],
CA:["Cagliari","Capoluogo della Sardegna, Cagliari si affaccia sul Golfo degli Angeli. Il quartiere storico di Castello domina la città dall'alto. La spiaggia del Poetto e lo stagno di Molentargius, con i fenicotteri rosa, sono a pochi minuti dal centro."],

const HUNT_THEMES = [
  {t:'Il soggiorno', w:['camino','lampada','tappeto','divano','specchio']},
  {t:'La cucina', w:['forno','pentola','mestolo','tegame','credenza']},

  {t:'La cantina', w:['botte','damigiana','cavatappi','scaffale','vino']},
  {t:"L'orto", w:['zucca','pomodoro','basilico','zappa','carciofo']},
  {t:'Il porto', w:['barca','faro','ancora','gabbiano','rete']},
  {t:'La bottega', w:['martello','pialla','chiodo','sega','banco']},
  {t:'Il bosco', w:['castagno','fungo','scoiattolo','sentiero','muschio']},
];
const TOKENS = {main:3, bonus:5, daily:4};
function rng(seed){ return () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }; }
const HUNTS = (() => {
  const r = rng(20261023), out = [];
  let t = new Date(2026, 9, 23).getTime();
  const order = HUNT_THEMES.map((_, i) => i);
  for (let k = 0; k < 150; k++){
    const days = 1 + Math.floor(r() * 14);
    const end = t + days * 864e5;
    const th = HUNT_THEMES[(k * 3 + Math.floor(r() * 2)) % HUNT_THEMES.length];
    const nw = Math.min(5, 2 + Math.floor(days / 3));
    const words = th.w.slice(0, nw);
    out.push({id:k, start:t, end, days, theme:th.t, words, total: words.join('').length});
    t = end + (1 + Math.floor(r() * 5)) * 864e5;
  }
  return out;
})();
function currentHunt(){ const n = Date.now(); return HUNTS.find(e => e.start <= n && n < e.end) || null; }
function nextHunt(){ const n = Date.now(); return HUNTS.find(e => e.start > n) || null; }
function huntState(e){
  if (!S.hunt || S.hunt.id !== e.id) S.hunt = {id:e.id, tok:{}, count:0, ms:[]};
  return S.hunt;
}
function fmtLeft(ms){
  const m = Math.max(0, Math.floor(ms / 6e4)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return (d ? d + 'g ' : '') + String(h).padStart(2,'0') + 'h ' + String(mm).padStart(2,'0') + 'm';
}
const huntMs = e => [Math.round(e.total/3), Math.round(e.total*2/3), e.total];
const huntRew = e => [40 + e.days*5, 60 + e.days*8, 150 + e.days*20];
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  const e = currentHunt(); if (!e || !G || G.view) return [];
  const keys = [...G.cells.keys()].sort();
  const r = rng(hashStr(e.id + ':' + G.mode + ':' + G.idx + ':' + (G.mode==='daily'?todayKey():'')));
  const out = [];
  while (out.length < Math.min(TOKENS[G.mode], keys.length)){ const k = keys[Math.floor(r()*keys.length)]; if (!out.includes(k)) out.push(k); }
  return out;

  const e = currentHunt(); if (!e) return;
  const st = huntState(e);
  if (st.tok[tokKey(k)] || st.count >= e.total) return;
  st.tok[tokKey(k)] = 1; st.count++;
  const el = G.cells.get(k).el; el.classList.remove('tok'); el.classList.add('got');
  const ms = huntMs(e), rw = huntRew(e);
  let msg = `Caccia alle lettere: ${st.count}/${e.total}`;
  ms.forEach((m, i) => { if (st.count >= m && !st.ms.includes(i)){ st.ms.push(i); S.coins += rw[i]; msg = i === 2 ? `Caccia completata! +${rw[i]} monete` : `Traguardo raggiunto: +${rw[i]} monete`; updateCoins(); } });

}

}

const QUIZ_PER = 50;
let Q = null;
function quizReview(ri){
  const r = REGIONS[ri];
  openCard(`<span class="bonus-tag">Quiz · ${r.n}</span><h2>Quiz già fatto</h2>
    <p>Hai risposto bene a <b>${S.quiz[ri]} domande su 3</b>. Ecco le risposte giuste:</p>
    <div class="qreview">${QUIZ[ri].map(([t, ok]) => `<div><p>${t}</p><b>${ok}</b></div>`).join('')}</div>
    <button class="btn" type="button" data-act="close">Chiudi</button>`);
}
function startQuiz(ri){
  if (S.quiz[ri] != null){ quizReview(ri); return; }
  Q = {ri, i:0, score:0, first: true, answered:false,
       qs: QUIZ[ri].map(([t, ok, a, b]) => ({t, ok, opts:[ok, a, b].sort(() => Math.random() - .5)}))};
  renderQuiz();
}
function renderQuiz(){
  const r = REGIONS[Q.ri], q = Q.qs[Q.i];
  openCard(`<span class="bonus-tag">Quiz · ${r.n}</span>
    <p class="qnum">Domanda ${Q.i+1} di ${Q.qs.length}${Q.first ? ` · ${QUIZ_PER} monete per risposta giusta` : ' · senza premio'}</p>
    <h3 class="qtext">${q.t}</h3>
    ${q.opts.map((o, k) => `<button class="btn qopt" type="button" data-qa="${k}">${o}</button>`).join('')}
    <div id="qnext"></div>`);
}
$('#card').addEventListener('click', e => {
  if (!Q) return;
  const a = e.target.closest('[data-qa]');
  if (a && !Q.answered){
    Q.answered = true;
    const q = Q.qs[Q.i], pick = q.opts[+a.dataset.qa], right = pick === q.ok;
    if (right) Q.score++;
    $('#card').querySelectorAll('.qopt').forEach(b => { b.disabled = true; if (b.textContent === q.ok) b.classList.add('ok'); else if (b === a) b.classList.add('ko'); });
    $('#qnext').innerHTML = `<p class="qfeed ${right ? 'okt' : 'kot'}">${right ? 'Esatto!' : 'Non è questa. La risposta giusta è evidenziata in verde.'}</p>
      <button class="btn primary" type="button" data-qn>${Q.i < Q.qs.length - 1 ? 'Avanti' : 'Vedi il risultato'}</button>`;
    return;
  }
  if (e.target.closest('[data-qn]')){
    Q.answered = false;
    if (Q.i < Q.qs.length - 1){ Q.i++; renderQuiz(); return; }
    finishQuiz();
  }
});
function finishQuiz(){
  const ri = Q.ri, r = REGIONS[ri], score = Q.score, first = Q.first, reward = first ? score * QUIZ_PER : 0;
  Q = null;
  if (first){ S.quiz[ri] = score; S.coins += reward; save(); updateCoins(); }
  const msg = score === 3 ? 'Perfetto!' : score === 2 ? 'Bravo!' : score === 1 ? 'Si può fare meglio' : 'Peccato!';
  openCard(`<span class="bonus-tag">Quiz · ${r.n}</span><h2>${msg}</h2>
    <p>Hai risposto bene a <b>${score} domande su 3</b>.${score < 3 ? ' Le risposte sono nelle schede delle città della regione.' : ''}</p>
    ${reward ? `<div class="reward"><i class="coin"></i>+${reward}</div>` : first ? '' : '<p>Il premio si vince solo al primo tentativo.</p>'}
    ${!S.bonusDone[ri] ? `<button class="btn primary" type="button" data-act="bonus:${ri}">Gioca il livello bonus</button>` : (doneCount() < total ? `<button class="btn primary" type="button" data-act="home">Scegli la prossima regione</button>` : '')}
    <button class="btn" type="button" data-act="region:${ri}">Province della ${r.n}</button>`);
}


// ---------- game ----------
let G = null;
function cellKey(r,c){ return r+','+c; }

function isDone(mode, idx){ return mode === 'main' ? !!S.done[idx] : mode === 'bonus' ? !!S.bonusDone[idx] : false; }
function startLevel(mode, idx, opt = {}){
  const lv = mode === 'daily' ? DATA.daily[idx] : mode === 'bonus' ? DATA.bonus[idx] : DATA.levels[lvOf(idx)];
  if (mode === 'main' && !opt.view) { S.curRegion = PROV[idx].ri; save(); }
  const cells = new Map();
  lv.words.forEach(([w,r,c,d], wi) => {
    for (let i=0;i<w.length;i++){
      const rr = d==='V'? r+i : r, cc = d==='H'? c+i : c, k = cellKey(rr,cc);
      if (!cells.has(k)) cells.set(k, {ch:w[i], r:rr, c:cc});
    }
  });
  G = {mode, idx, lv, cells, revealed:new Set(), hinted:new Set(), found:new Set(), bonusFound:[], letters: lv.letters.split(''), view: !!opt.view, noSave: isDone(mode, idx)};
  if (G.view){ cells.forEach((_, k) => G.revealed.add(k)); lv.words.forEach((_, wi) => G.found.add(wi)); }
  const cur = S['cur_'+mode];
  if (!G.noSave && cur && cur.idx===idx && (mode!=='daily' || cur.day===todayKey())){
    cur.revealed.forEach(k => G.revealed.add(k)); (cur.hinted||[]).forEach(k=>G.hinted.add(k));
    cur.found.forEach(i => G.found.add(i)); G.bonusFound = cur.bonusFound.slice();
    if (cur.letters) G.letters = cur.letters.split('');
  }
  if (mode === 'daily'){
    setSky(['#3d2f5c','#e9926b']); $('#gTitle').textContent = 'Sfida del giorno';
    $('#gSub').textContent = new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  } else if (mode === 'bonus'){
    const r = REGIONS[idx]; setSky(['#5a3a12', r.c[1]]);
    $('#gTitle').textContent = 'Bonus ' + r.n; $('#gSub').textContent = `Livello bonus · ${lv.words.length} parole`;
  } else {
    const pv = PROV[idx], r = REGIONS[pv.ri]; setSky(r.c);
    $('#gTitle').textContent = pv.name; $('#gSub').textContent = `${r.n} · provincia ${pv.pi+1} di ${r.p.length}`;
  }
  if (G.view) $('#gSub').textContent = 'Schema completato ✓';
  else if (G.noSave) $('#gSub').textContent += ' · rigioco';
  $('#game').classList.toggle('viewmode', G.view);
  show('game');
  buildGrid(); buildWheel(); updateBonusUI(); setPreview('');
  if (G.view) $('#preview').innerHTML = `<span class="toast">Schema completato ✓</span>`;
  persistCur();
}

function persistCur(){
  if (!G || G.view || G.noSave) return;
  S['cur_'+G.mode] = {idx:G.idx, day: G.mode==='daily'? todayKey(): null, revealed:[...G.revealed], hinted:[...G.hinted], found:[...G.found], bonusFound:G.bonusFound, letters:G.letters.join('')};
  save();
}

function buildGrid(){
  const grid = $('#grid'), board = $('#board');
  grid.innerHTML = '';
  const {h,w} = G.lv;
  const bw = board.clientWidth, bh = board.clientHeight - 16;
  const gap = Math.max(h,w) > 8 ? 3 : 4;
  const size = Math.max(20, Math.min(56, Math.floor((bw - gap*(w-1))/w), Math.floor((bh - gap*(h-1))/h)));
  grid.style.width = (w*size + (w-1)*gap)+'px'; grid.style.height = (h*size + (h-1)*gap)+'px';
  const toks = tokenCells(), he = currentHunt(), huntSt = he ? huntState(he) : null;
  for (const [k, cell] of G.cells){
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.cssText = `left:${cell.c*(size+gap)}px;top:${cell.r*(size+gap)}px;width:${size}px;height:${size}px;font-size:${Math.round(size*.56)}px`;
    cell.el = el;
    if (toks.includes(k) && !(huntSt && huntSt.tok[tokKey(k)])) el.classList.add('tok');
    grid.appendChild(el);
    if (G.revealed.has(k)) reveal(k, false);
  }
}

function reveal(k, animate=true, hint=false){
  const cell = G.cells.get(k);
  G.revealed.add(k);
  if (hint) G.hinted.add(k);
  if (!cell.el.classList.contains('on')){
    cell.el.classList.add('on');
    if (G.hinted.has(k)) cell.el.classList.add('hint');
    cell.el.innerHTML = `<span style="${animate?'':'animation:none'}">${cell.ch}</span>`;
  }
  if (cell.el.classList.contains('tok')) collectToken(k);
}

function wordCells(wi){ const [w,r,c,d] = G.lv.words[wi]; return [...w].map((_,i)=> cellKey(d==='V'?r+i:r, d==='H'?c+i:c)); }
function checkWordsComplete(){ G.lv.words.forEach((_, wi) => { if (!G.found.has(wi) && wordCells(wi).every(k => G.revealed.has(k))) G.found.add(wi); }); }

function submit(word){
  if (word.length < 3){ setPreview(''); return; }
  const wi = G.lv.words.findIndex(x => x[0] === word);
  if (wi >= 0){
    const ks = wordCells(wi);
    if (G.found.has(wi)){
      setPreview(word, 'dup', 'Già trovata');
      ks.forEach(k => { const el = G.cells.get(k).el; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); });
      return;
    }
    G.found.add(wi);
    ks.forEach((k,i) => setTimeout(()=>reveal(k), i*70));
    ks.forEach(k => G.revealed.add(k));
    setPreview(word, 'ok');
    checkWordsComplete(); persistCur();
    setTimeout(checkWin, ks.length*70 + 400);
    return;
  }
  if (G.lv.bonus.includes(word)){
    if (G.bonusFound.includes(word)){ setPreview(word, 'dup', 'Bonus già trovato'); return; }
    G.bonusFound.push(word); S.meter++;
    let msg = 'Parola bonus!';
    if (S.meter >= METER){ S.meter = 0; S.coins += METER_REWARD; msg = `Bonus completo: +${METER_REWARD} monete`; updateCoins(); }
    setPreview(word, 'bonus', msg); updateBonusUI(); persistCur();
    return;
  }
  setPreview(word, 'bad');
}

function postcard(ri){
  const r = REGIONS[ri];
  return `<div class="postcard" style="background:linear-gradient(135deg,${r.c[0]},${r.c[1]})"><span class="stamp">${ri+1}</span><small>Cartolina dalla tappa</small><b>${r.n}</b><p>${r.f}</p></div>`;
}

let winShown = false;
function checkWin(){
  if (!G || G.revealed.size < G.cells.size || winShown) return;
  winShown = true;
  let reward = 0, html;
  const bonusLine = `<p>Parole bonus: ${G.bonusFound.length} su ${G.lv.bonus.length}</p>`;
  if (G.mode === 'daily'){
    const first = !S.dailyDone[todayKey()];
    reward = first ? 50 : 0;
    S.dailyDone[todayKey()] = true;
    html = `<h2>Sfida vinta!</h2>${reward?`<div class="reward"><i class="coin"></i>+${reward}</div>`:'<p>Torna domani per una nuova sfida.</p>'}${bonusLine}
      <button class="btn primary" type="button" data-act="home">Torna al menu</button>`;
  } else if (G.mode === 'bonus'){
    const ri = G.idx, first = !S.bonusDone[ri];
    reward = first ? BONUS_REWARD : 0; S.bonusDone[ri] = true;
    const nextRi = ri + 1;
    html = `<span class="bonus-tag">Livello bonus</span><h2>${REGIONS[ri].n} conquistata!</h2>
      ${reward?`<div class="reward"><i class="coin"></i>+${reward}</div>`:''}${bonusLine}
      ${S.quiz[ri] == null ? `<button class="btn primary" type="button" data-act="quiz:${ri}">Quiz della regione · fino a ${QUIZ_PER*3} monete</button>` : ''}
      ${doneCount() < total ? `<button class="btn ${S.quiz[ri] == null ? '' : 'primary'}" type="button" data-act="home">Scegli la prossima regione</button>` : ''}
      <button class="btn" type="button" data-act="region:${ri}">Torna alla regione</button>`;
  } else {
    const pv = PROV[G.idx], r = REGIONS[pv.ri];
    const firstTime = !S.done[G.idx];
    reward = firstTime ? 10 + Math.floor(lvOf(G.idx)/10)*2 : 0;
    if (firstTime) S.done[G.idx] = 1;
    const nIdx = nextInRegion(pv.ri, G.idx), next = nIdx != null ? PROV[nIdx] : null;
    if (regionDone(pv.ri) && !S.chests[pv.ri]){
      const cr = chestReward(pv.ri);
      S.chests[pv.ri] = true; reward += cr;
      html = `<h2>Regione completata!</h2><div class="chest" aria-hidden="true"></div>
        <p>Hai aperto lo scrigno della ${r.n}: <b>+${cr}</b> monete, e hai sbloccato il livello bonus.</p>
        <div class="reward"><i class="coin"></i>+${reward}</div>
        ${cityCard(G.idx)}
        ${postcard(pv.ri)}
        <button class="btn primary" type="button" data-act="quiz:${pv.ri}">Quiz della regione · fino a ${QUIZ_PER*3} monete</button>
        <button class="btn" type="button" data-act="bonus:${pv.ri}">Gioca il livello bonus</button>
        <button class="btn" type="button" data-act="home">Scegli la prossima regione</button>`;
    } else {
      html = `<h2>${['Bravo!','Ottimo!','Perfetto!','Grande!'][G.idx%4]}</h2>
        <p>Provincia di ${pv.name} completata.</p>
        ${reward?`<div class="reward"><i class="coin"></i>+${reward}</div>`:''}
        ${cityCard(G.idx)}${bonusLine}
        ${next ? `<button class="btn primary" type="button" data-act="go:${nIdx}">Prossima provincia: ${next.name}</button>` : doneCount() >= total ? `<p>Hai completato il giro d'Italia delle parole!</p>` : ''}
        <button class="btn" type="button" data-act="region:${pv.ri}">Province della ${r.n}</button>
        <button class="btn" type="button" data-act="home">Cambia regione</button>`;
    }
  }
  S.coins += reward; if (!G.noSave) S['cur_'+G.mode] = null; save(); updateCoins();
  openCard(html);
}

function hint(n, cost){
  if (S.coins < cost){ setPreview('', null, 'Monete insufficienti'); return; }
  const hidden = [...G.cells.keys()].filter(k => !G.revealed.has(k));
  if (!hidden.length) return;
  S.coins -= cost; updateCoins();
  for (let i=0;i<n && hidden.length;i++){
    const k = hidden.splice(Math.floor(Math.random()*hidden.length),1)[0];
    G.revealed.add(k); G.hinted.add(k);
    setTimeout(()=>reveal(k, true, true), i*120);
  }
  checkWordsComplete(); persistCur();
  setTimeout(checkWin, n*120+300);
}

function updateBonusUI(){
  $('#bonusCount').textContent = G ? G.bonusFound.length : 0;
  $('#meter').style.width = (S.meter/METER*100)+'%';
}

let previewTimer;
function setPreview(word, state, msg){
  const p = $('#preview'); clearTimeout(previewTimer);
  if (!word && !msg){ p.innerHTML=''; return; }
  p.innerHTML = word ? `<span class="pill ${state||''}">${word}</span>` : `<span class="toast">${msg}</span>`;
  if (state){
    previewTimer = setTimeout(()=>{ p.innerHTML = msg && word ? `<span class="toast">${msg}</span>` : ''; if (msg && word) previewTimer = setTimeout(()=>p.innerHTML='', 1100); }, state==='bad'?450:650);
  } else if (msg){ previewTimer = setTimeout(()=>p.innerHTML='', 1400); }
}

// ---------- wheel ----------
let path = [], pointerPos = null, letterEls = [];
function buildWheel(){
  const wheel = $('#wheel');
  wheel.querySelectorAll('.letter').forEach(e => e.remove());
  letterEls = G.letters.map(ch => { const el = document.createElement('div'); el.className='letter'; el.textContent = ch; wheel.appendChild(el); return el; });
  layoutLetters();
}
function layoutLetters(){
  const n = letterEls.length, R = n <= 4 ? 30 : n <= 6 ? 33 : 35;
  const size = $('#wheel').clientWidth;
  letterEls.forEach((el, i) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    el.style.left = (50 + R*Math.cos(a))+'%'; el.style.top = (50 + R*Math.sin(a))+'%';
    el.style.fontSize = Math.round(size * (n<=5 ? .13 : .115))+'px';
    el.style.width = (n<=5?26:n<=6?24:22)+'%';
  });
}
function centers(){
  const wr = $('#wheel').getBoundingClientRect();
  return letterEls.map(el => { const r = el.getBoundingClientRect(); return {x:r.left+r.width/2-wr.left, y:r.top+r.height/2-wr.top, rad:r.width/2}; });
}
function hitTest(x, y){
  const cs = centers();
  for (let i=0;i<cs.length;i++){ const dx = x-cs[i].x, dy = y-cs[i].y; if (dx*dx+dy*dy <= (cs[i].rad*.9)**2) return i; }
  return -1;
}
function drawLines(){
  const svg = $('#lines'), cs = centers();
  const size = $('#wheel').clientWidth;
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  let pts = path.map(i => `${cs[i].x},${cs[i].y}`);
  if (pointerPos && path.length) pts.push(`${pointerPos.x},${pointerPos.y}`);
  svg.innerHTML = pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="#e2573b" stroke-width="${Math.max(6,size*.03)}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>` : '';
  letterEls.forEach((el,i)=> el.classList.toggle('sel', path.includes(i)));
  if (path.length){ clearTimeout(previewTimer); $('#preview').innerHTML = `<span class="pill">${path.map(i => G.letters[i]).join('')}</span>`; }
}
function local(e){ const r = $('#wheel').getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
let dragging = false;
$('#wheel').addEventListener('pointerdown', e => {
  if (!G || G.view) return;
  const p = local(e), i = hitTest(p.x, p.y);
  if (i < 0) return;
  dragging = true; path = [i]; pointerPos = p;
  try { $('#wheel').setPointerCapture(e.pointerId); } catch(_) {}
  drawLines(); e.preventDefault();
});
$('#wheel').addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = local(e); pointerPos = p;
  const i = hitTest(p.x, p.y);
  if (i >= 0){
    if (path.length >= 2 && path[path.length-2] === i) path.pop();
    else if (!path.includes(i)) path.push(i);
  }
  drawLines();
});
function endDrag(){
  if (!dragging) return;
  dragging = false;
  const word = path.map(i => G.letters[i]).join('');
  path = []; pointerPos = null; drawLines();
  submit(word);
}
$('#wheel').addEventListener('pointerup', endDrag);
$('#wheel').addEventListener('pointercancel', endDrag);

$('#shuffleBtn').onclick = () => {
  if (!G || G.view) return;
  const old = G.letters.join('');
  for (let t=0;t<10 && G.letters.join('')===old;t++){
    for (let i=G.letters.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [G.letters[i],G.letters[j]]=[G.letters[j],G.letters[i]]; }
  }
  letterEls.forEach((el,i)=> el.textContent = G.letters[i]);
  persistCur();
};
$('#hintBtn').onclick = () => { if (G && !G.view) hint(1, HINT); };
$('#rocketBtn').onclick = () => { if (G && !G.view) hint(4, ROCKET); };
$('#preview').addEventListener('click', e => { if (e.target.closest('[data-replay]') && G) startLevel(G.mode, G.idx); });
$('#bonusBtn').onclick = () => {
  const list = G.bonusFound.length ? `<div class="bonus-list">${G.bonusFound.map(w=>`<span>${w}</span>`).join('')}</div>` : '<p>Nessuna ancora. Cerca parole valide che non sono nello schema.</p>';
  openCard(`<h2>Parole bonus</h2><p>Trovate ${G.bonusFound.length} su ${G.lv.bonus.length}. Ogni ${METER} parole bonus guadagni ${METER_REWARD} monete (${S.meter}/${METER}).</p>${list}<button class="btn" type="button" data-act="close">Chiudi</button>`);
};

// ---------- overlay ----------
function openCard(html){ if (!html.includes('id="huntTime"') && !html.includes('Nessuna caccia')) $('#card').classList.remove('hunt-card'); $('#card').innerHTML = html; $('#overlay').hidden = false; $('#card').scrollTop = 0; }
function closeCard(){ $('#overlay').hidden = true; }
$('#overlay').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  closeCard(); winShown = false;
  const [a, arg] = act.split(':');
  if (a==='go') startLevel('main', +arg);
  if (a==='main') playMain();
  if (a==='bonus') startLevel('bonus', +arg);
  if (a==='quiz') startQuiz(+arg);
  if (a==='view') { const [m, i] = arg.split('-'); startLevel(m, +i, {view:true}); }
  if (a==='replay') { const [m, i] = arg.split('-'); startLevel(m, +i); }
  if (a==='region') { G=null; openRegion(+arg); }
  if (a==='home') { G=null; show('home'); }
  if (a==='play') playMain();
});

function helpCard(first){
  openCard(`<h2>Come si gioca</h2>
  <ul class="rules">
   <li>Trascina il dito sulle lettere della ruota per comporre una parola, poi solleva.</li>
   <li>Le parole giuste compaiono nello schema. Completa lo schema per passare alla provincia successiva.</li>
   <li>Le altre parole valide sono <b>bonus</b>: ogni ${METER} bonus vinci ${METER_REWARD} monete.</li>
   <li>Usa le monete per la <b>lampadina</b> (una lettera, ${HINT}) o il <b>razzo</b> (quattro lettere, ${ROCKET}).</li>
   <li>Ogni tanto parte la <b>Caccia alle lettere</b>, una sfida a tempo da 1 giorno a 2 settimane: scopri le caselle con il bollino d'oro per completare le parole nascoste.</li>
   <li>Alla fine di ogni provincia trovi una scheda sulla città e la sua posizione sulla mappa. Puoi rileggerla dal percorso con il tasto <b>i</b>.</li>
   <li>A fine regione c'è un <b>quiz</b> di 3 domande: ${QUIZ_PER} monete per ogni risposta giusta, fino a ${QUIZ_PER*3}.</li>
   <li>Scegli tu dove giocare: tocca una regione sulla cartina iniziale. Le province si fanno nell'ordine che preferisci, e gli schemi diventano più difficili man mano che ne completi.</li>
   <li>Completa tutte le province di una regione per aprire lo <b>scrigno</b>, ricevere la cartolina e sbloccare il <b>livello bonus</b> (+${BONUS_REWARD} monete).</li>
  </ul>
  <button class="btn primary" type="button" data-act="${first?'play':'close'}">${first?'Iniziamo':'Ho capito'}</button>`);
}

function setPreviewHome(msg){
  const m = $('#homeMap .tmap-hint'); if (!m) return;
  m.textContent = msg; m.classList.remove('blink'); void m.offsetWidth; m.classList.add('blink');
}
function playMain(){
  const nx = nextInRegion(S.curRegion);
  if (nx != null){ startLevel('main', nx); return; }
  show('home');
  setPreviewHome('Tocca una regione sulla cartina per cominciare');
}

$('#playBtn').onclick = () => { if (!S.seenHelp){ S.seenHelp = true; save(); helpCard(true); } else playMain(); };
$('#dailyBtn').onclick = () => startLevel('daily', dailyIndex());
$('#trailBtn').onclick = () => { show('trail'); renderTrail(); };
$('#helpBtn').onclick = () => helpCard(false);
$('#huntBtn').onclick = huntCard;
$('#albumBtn').onclick = () => {
  const n = Object.keys(S.chests).length;
  openCard(`<h2>Album cartoline</h2><p>${n} di ${REGIONS.length} regioni completate.</p>
    <div class="album">${REGIONS.map((r,i) => S.chests[i] ? postcard(i) : `<div class="locked">${r.n}<br>da conquistare</div>`).join('')}</div>
    <button class="btn" type="button" data-act="close">Chiudi</button>`);
};
document.querySelectorAll('.back').forEach(b => b.onclick = () => {
  if (G && G.mode !== 'daily' && !$('#game').hidden){ const ri = G.mode === 'bonus' ? G.idx : PROV[G.idx].ri; G = null; openRegion(ri); }
  else { G = null; show('home'); }
});
$('#regionBack').onclick = () => { show('trail'); renderTrail(); };

function trailMap(){
  const bySig = {}; PROV.forEach((p, i) => bySig[MAP.map[p.sig]] = i);
  const nx = nextInRegion(S.curRegion);
  const started = ri => doneIn(ri) > 0 || ri === S.curRegion;
  const paths = Object.entries(MAP.paths).map(([k, d]) => {
    const i = bySig[k]; if (i === undefined) return '';
    const pv = PROV[i], r = REGIONS[pv.ri];
    const done = !!S.done[i], cur = i === nx;
    const fill = done ? r.c[0] : cur ? '#f2b632' : started(pv.ri) ? '#fbe7b0' : '#ffffff';
    return `<path d="${d}" fill="${fill}" stroke="${done ? '#ffffff' : '#c9c4b8'}" stroke-width="${done ? 1.5 : 1.2}" stroke-linejoin="round" data-r="${pv.ri}" class="tap${cur ? ' curp' : ''}"><title>${pv.name} · ${r.n}${done ? ' ✓' : ''}</title></path>`;
  }).join('');
  const pt = nx != null && MAP.pts[PROV[nx].sig];
  const pin = pt ? `<circle class="ping" cx="${pt[0]}" cy="${pt[1]}" r="14" fill="none" stroke="#1d2433" stroke-width="5"/><circle cx="${pt[0]}" cy="${pt[1]}" r="12" fill="#1d2433" stroke="#fff" stroke-width="5"/>` : '';
  const doneReg = REGIONS.filter((_, i) => regionDone(i)).length;
  return `<div class="tmap"><div class="tmap-head"><b>${doneCount()}<small>/${total} province</small></b><b>${doneReg}<small>/${REGIONS.length} regioni</small></b></div>
    <svg viewBox="${MAP.vb.join(' ')}" role="img" aria-label="Mappa d'Italia: tocca una regione per sceglierla">${paths}${pin}</svg>
    <div class="tmap-leg"><span><i style="background:#4a5a3a"></i>Completata</span><span><i style="background:#f2b632"></i>Prossima</span><span><i style="background:#fbe7b0"></i>Regione iniziata</span><span><i style="background:#fff"></i>Da scoprire</span></div>
    <p class="tmap-hint">Tocca una regione per sceglierla.</p></div>`;
}
function renderTrail(){
  setSky(['#2b4a6b','#d9a877']);
  const cur = S.curRegion ?? 0;
  $('#trailList').innerHTML = REGIONS.map((r,i) => {
    const doneN = doneIn(i);
    const unlocked = true;
    const full = doneN === r.p.length;
    const sub = full ? (S.bonusDone[i] ? 'Regione e bonus completati' : 'Livello bonus da giocare') : unlocked ? `${r.p.length} ${r.p.length===1?'provincia':'province'}` : 'Bloccata';
    return `<button class="stop" type="button" data-r="${i}" ${unlocked?'':'disabled'}>
      <span class="n ${full && S.bonusDone[i] ? 'done':''}" style="background:linear-gradient(135deg,${r.c[0]},${r.c[1]})">${i+1}</span>
      <span><b>${r.n}</b><small>${sub}</small></span>
      <span class="prog">${doneN}/${r.p.length}${S.bonusDone[i]?' ★':''}</span>
    </button>`;
  }).join('');
  $('#trailList').children[cur]?.scrollIntoView?.({block:'center'});
}
$('#homeMap').addEventListener('click', e => { const m = e.target.closest('path.tap'); if (m) openRegion(+m.dataset.r); });
$('#trailList').addEventListener('click', e => {
  const b = e.target.closest('.stop'); if (!b || b.disabled) return;
  openRegion(+b.dataset.r);
});

function openRegion(ri){
  const r = REGIONS[ri];
  setSky(r.c);
  $('#rTitle').textContent = r.n; $('#rSub').textContent = `Tappa ${ri+1} di ${REGIONS.length}`;
  const rows = r.p.map(([name, sig], pi) => {
    const idx = r.start + pi, done = !!S.done[idx], open = true;
    return `<div class="provrow"><button class="prov" type="button" data-l="${idx}" ${open?'':'disabled'}>
      <span class="sig">${sig}</span>
      <span><b>${name}</b><small>${done ? 'Completata · tocca per rivedere' : open ? 'Da giocare' : 'Bloccata'} · ${DATA.levels[peekLv(idx)].words.length} parole</small></span>
      <span class="st">${done?'✓':''}</span></button>${done ? `<button class="infobtn" type="button" data-i="${idx}" aria-label="Scheda di ${name}">i</button>` : ''}</div>`;
  });
  const bOpen = regionDone(ri);
  rows.push(`<button class="prov bonus" type="button" data-b="${ri}" ${bOpen?'':'disabled'}>
      <span class="sig">★</span>
      <span><b>Livello bonus</b><small>${S.bonusDone[ri] ? 'Completato · tocca per rivedere' : bOpen ? `${DATA.bonus[ri].words.length} parole · +${BONUS_REWARD} monete` : 'Completa tutte le province per sbloccarlo'}</small></span>
      <span class="st">${S.bonusDone[ri]?'✓':''}</span></button>`);
  const qd = S.quiz[ri];
  rows.push(`<button class="prov bonus" type="button" data-q="${ri}" ${bOpen?'':'disabled'}>
      <span class="sig">?</span>
      <span><b>Quiz della regione</b><small>${qd != null ? `Fatto: ${qd} su 3 · tocca per vedere le risposte` : bOpen ? `3 domande · ${QUIZ_PER} monete per risposta giusta` : 'Completa tutte le province per sbloccarlo'}</small></span>
      <span class="st">${qd != null ? '✓' : ''}</span></button>`);
  $('#provList').innerHTML = `<div class="region-head"><p>${r.p.length} ${r.p.length===1?'provincia':'province'} · scrigno da ${chestReward(ri)} monete${S.chests[ri]?' (aperto)':''}</p></div>` + rows.join('');
  show('region');
}
$('#provList').addEventListener('click', e => {
  const qb = e.target.closest('[data-q]'); if (qb){ if (!qb.disabled) startQuiz(+qb.dataset.q); return; }
  const inf = e.target.closest('.infobtn');
  if (inf){ openCard(`<h2>${PROV[+inf.dataset.i].name}</h2>${cityCard(+inf.dataset.i)}<button class="btn" type="button" data-act="close">Chiudi</button>`); return; }
  const b = e.target.closest('.prov'); if (!b || b.disabled) return;
  const mode = b.dataset.b !== undefined ? 'bonus' : 'main', idx = mode === 'bonus' ? +b.dataset.b : +b.dataset.l;
  if (!isDone(mode, idx)) { startLevel(mode, idx); return; }
  const title = mode === 'bonus' ? 'Bonus ' + REGIONS[idx].n : PROV[idx].name;
  openCard(`<h2>${title}</h2><p><b>Completato ✓</b> Hai già finito questo schema: puoi rivederlo, ma non rigiocarlo.</p>
    ${mode === 'main' ? cityCard(idx) : ''}
    <button class="btn primary" type="button" data-act="view:${mode}-${idx}">Rivedi lo schema completato</button>
    <button class="btn" type="button" data-act="close">Chiudi</button>`);
});

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(()=>{ if (G && !$('#game').hidden){ buildGrid(); layoutLetters(); } }, 120); });

show('home');
</script>

</body></html>
